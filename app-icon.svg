<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024" fill="none">
  <!-- 纯透明背景：白色填充，黑色描边纸飞机 -->
  <g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- 纸飞机机身大轮廓：纯白填充，纯黑描边 -->
    <polygon points="22 2 15 22 11 13 2 9 22 2" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <!-- 底部立体折叠小三角：白底微阴影，纯黑描边 -->
    <polygon points="11 13 15 22 13.5 17" fill="#e2e8f0" stroke="#000000" stroke-width="1.8" />
    <!-- 中间主轴折线：纯黑线条 -->
    <line x1="22" y1="2" x2="11" y2="13" stroke="#000000" stroke-width="1.8" />
  </g>
</svg>
